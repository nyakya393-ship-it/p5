<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b0d0f"
    >

    <title>ブキ性能アナライザー</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <header class="app-header">

        <div class="header-inner">

            <div class="brand">

                <div class="brand-small">
                    SPLATOON 3
                </div>

                <h1>
                    ブキ性能アナライザー
                </h1>

            </div>

            <div
                id="statusText"
                class="status-pill"
            >
                準備中…
            </div>

        </div>

    </header>


    <main class="app-main">


        <!-- =========================
             SEARCH
        ========================== -->

        <section class="search-card">

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="ブキ名を検索"
                    autocomplete="off"
                    spellcheck="false"
                >

            </div>

        </section>


        <!-- =========================
             CATEGORY
        ========================== -->

        <section class="category-card">

            <div class="section-title-row">

                <h2>
                    ブキカテゴリ
                </h2>

                <span
                    id="categoryCount"
                    class="count-pill"
                >
                    0
                </span>

            </div>

            <div
                id="categoryList"
                class="category-list"
            ></div>

        </section>


        <!-- =========================
             WEAPON LIST
        ========================== -->

        <section class="weapon-card">

            <div class="section-title-row">

                <h2>
                    ブキ一覧
                </h2>

                <span
                    id="weaponCount"
                    class="count-pill"
                >
                    0
                </span>

            </div>

            <div
                id="weaponList"
                class="weapon-list"
            >

                <div class="empty-list">
                    <div class="empty-icon">
                        ＋
                    </div>

                    <strong>
                        カテゴリを選択してください
                    </strong>

                    <span>
                        ブキ一覧を読み込みます
                    </span>
                </div>

            </div>

        </section>


        <!-- =========================
             DETAIL
        ========================== -->

        <section
            id="weaponDetail"
            class="detail-area"
        >

            <div class="detail-placeholder">

                <div class="placeholder-mark">
                    +
                </div>

                <h2>
                    ブキを選択してください
                </h2>

                <p>
                    選択したブキの性能データを取得します
                </p>

            </div>

        </section>


    </main>


    <footer class="app-footer">

        <div>
            SPLATOON 3 WEAPON ANALYZER
        </div>

        <small>
            Data source: WikiWiki.jp / splatoon3mix
        </small>

    </footer>


    <script
        src="./app.js"
        defer
    ></script>

</body>
</html>
